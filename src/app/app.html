<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav #sidenav mode="over" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">live_tv</mat-icon>
      <h2>Proyecto VD</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/catalog" routerLinkActive="active" (click)="sidenav.close()">
        <mat-icon matListItemIcon>movie</mat-icon>
        <span matListItemTitle>Catálogo</span>
      </a>
      <a mat-list-item routerLink="/player/demo-1" routerLinkActive="active" (click)="sidenav.close()">
        <mat-icon matListItemIcon>play_circle</mat-icon>
        <span matListItemTitle>Reproductor</span>
      </a>
      <a mat-list-item routerLink="/admin" routerLinkActive="active" (click)="sidenav.close()">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Administración</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Menu navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="brand-title">
        <mat-icon class="brand-icon">play_circle_filled</mat-icon>
        Proyecto VD - Video Streaming Platform
      </span>
      <span class="spacer"></span>
      <a mat-button routerLink="/catalog" routerLinkActive="active-link">Catálogo</a>
      <a mat-button routerLink="/admin" routerLinkActive="active-link">Administración</a>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
